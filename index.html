<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>سنتر ميس رحمة</title>
    <!-- خط يشبه الكتابة اليدوية بالماركر -->
    <link href="https://fonts.googleapis.com/css2?family=Lemonada:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            /* حائط السنتر (لون هادي وواقعي) */
            background-color: #e9ecef;
            background-image: linear-gradient(0deg, #dee2e6 0%, #f8f9fa 100%);
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-family: 'Lemonada', cursive;
            overflow: hidden;
            padding: 20px;
        }

        /* الوايت بورد الحقيقية */
        .whiteboard-container {
            position: relative;
            width: 100%;
            max-width: 500px;
            /* نسبة وتناسب عشان تظبط على أي موبايل */
            aspect-ratio: 4 / 3;
            background: #ffffff;
            border-radius: 8px;
            /* إطار ألومنيوم واقعي */
            border: 12px solid;
            border-image: linear-gradient(to right, #cfd9df, #e2ebf0, #cfd9df) 1;
            box-shadow: 
                0 20px 40px rgba(0,0,0,0.15), 
                inset 0 0 30px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 10;
        }

        /* لمعة السبورة */
        .whiteboard-container::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(135deg, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 50%);
            pointer-events: none;
        }

        /* رف الأقلام المعدن */
        .tray {
            position: absolute;
            bottom: -22px;
            left: 5%;
            width: 90%;
            height: 15px;
            background: linear-gradient(to bottom, #b0bec5, #78909c);
            border-radius: 0 0 5px 5px;
            box-shadow: 0 10px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: flex-end;
            padding: 0 20px;
            gap: 15px;
        }

        /* المساحة */
        .eraser {
            width: 50px;
            height: 25px;
            background: #34495e;
            border-top: 6px solid #ecf0f1;
            margin-bottom: 5px;
            border-radius: 2px;
            box-shadow: -2px 2px 5px rgba(0,0,0,0.3);
            position: absolute;
            right: 20px;
            bottom: 5px;
            z-index: 20;
        }

        /* أقلام الماركر */
        .marker {
            width: 60px;
            height: 12px;
            border-radius: 2px;
            margin-bottom: 5px;
            box-shadow: -1px 2px 3px rgba(0,0,0,0.2);
        }
        .marker.red { background: linear-gradient(to bottom, #e74c3c, #c0392b); }
        .marker.blue { background: linear-gradient(to bottom, #3498db, #2980b9); }

        /* النص المكتوب */
        .board-text {
            color: #2c3e50; /* لون الماركر الأسود/الكحلي */
            text-align: center;
            font-size: 1.4rem;
            line-height: 1.8;
            font-weight: 700;
            position: relative;
            z-index: 5;
            width: 100%;
            transition: opacity 0.3s ease;
        }

        /* زرار مايك الإدارة واقعي */
        .mic-btn {
            margin-top: 50px;
            background: linear-gradient(to bottom, #f39c12, #d35400);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 1.2rem;
            font-family: inherit;
            border-radius: 30px;
            font-weight: bold;
            box-shadow: 0 8px 15px rgba(211, 84, 0, 0.4), inset 0 2px 2px rgba(255,255,255,0.3);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mic-btn:active {
            transform: scale(0.95);
            box-shadow: 0 4px 10px rgba(211, 84, 0, 0.4);
        }

        /* أنيميشن مسح السبورة */
        @keyframes wipeBoard {
            0% { transform: translate(0, 0); }
            20% { transform: translate(-80px, -150px) rotate(-10deg); }
            40% { transform: translate(-200px, -120px) rotate(5deg); }
            60% { transform: translate(-100px, -80px) rotate(-5deg); }
            80% { transform: translate(-250px, -50px) rotate(10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .wiping {
            animation: wipeBoard 2s ease-in-out forwards;
        }

        /* النص الجديد */
        .new-text {
            color: #c0392b; /* قلم أحمر للفت الانتباه */
            font-size: 1.3rem;
        }

        .highlight {
            color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="whiteboard-container">
        <!-- النص اللي مكتوب في البداية -->
        <div id="boardText" class="board-text">
            شرح المنهج المكثف<br>
            مع الأستاذة / <span class="highlight">رحمة</span><br>
            (ممنوع الصوت في القاعة)
        </div>

        <!-- رف الأقلام -->
        <div class="tray">
            <div class="marker red"></div>
            <div class="marker blue"></div>
            <div id="eraser" class="eraser"></div>
        </div>
    </div>

    <!-- مايك الإدارة -->
    <button id="micBtn" class="mic-btn" onclick="makeAnnouncement()">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
            <line x1="12" y1="19" x2="12" y2="23"></line>
            <line x1="8" y1="23" x2="16" y2="23"></line>
        </svg>
        إعلان عاجل من الإدارة
    </button>

    <script>
        function makeAnnouncement() {
            const btn = document.getElementById('micBtn');
            const eraser = document.getElementById('eraser');
            const boardText = document.getElementById('boardText');

            // إخفاء الزرار
            btn.style.display = 'none';

            // تشغيل أنيميشن المساحة
            eraser.classList.add('wiping');

            // بعد ثانية واحدة (في نص مسح السبورة)، النص القديم يختفي
            setTimeout(() => {
                boardText.style.opacity = '0';
            }, 1000);

            // بعد ما المساحة ترجع مكانها (2 ثانية)، نكتب الإعلان الجديد
            setTimeout(() => {
                boardText.innerHTML = `
                    <div class="new-text">
                        🚨 إعلان عاجل 🚨<br><br>
                        إلغاء جميع الحصص فوراً لراحة الأستاذة رحمة..<br>
                        صحتك بالدنيا، روحي ارتاحي ومفيش شغل النهاردة ❤️<br>
                        <span style="color:#2c3e50; font-size:1rem; display:block; margin-top:10px;">إمضاء: هوبا ✍️</span>
                    </div>
                `;
                // إظهار النص الجديد
                boardText.style.opacity = '1';
                
                // قلوب بسيطة واقعية
                createHearts();
            }, 2200);
        }

        function createHearts() {
            for(let i = 0; i < 15; i++) {
                setTimeout(() => {
                    let heart = document.createElement('div');
                    heart.innerHTML = '❤️';
                    heart.style.position = 'absolute';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.bottom = '0';
                    heart.style.fontSize = (Math.random() * 15 + 15) + 'px';
                    heart.style.zIndex = 100;
                    heart.style.transition = 'all 3s ease-out';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => {
                        heart.style.bottom = '100vh';
                        heart.style.opacity = '0';
                    }, 50);
                    
                    setTimeout(() => heart.remove(), 3000);
                }, i * 200);
            }
        }
    </script>
</body>
</html>
