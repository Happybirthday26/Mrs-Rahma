<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سنتر ميس رحمة 3D</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: #111; /* خلفية ضلمة حوالين السنتر */
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            perspective: 1200px;
        }

        .camera {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* قاعة السنتر */
        .world {
            width: 600px;
            height: 600px;
            position: relative;
            transform-style: preserve-3d;
            /* زاوية الرؤية من فوق بميل */
            transform: rotateX(65deg) rotateZ(-35deg) scale(0.7);
            transition: transform 2.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* لما الكاميرا تعمل زووم وتدخل جوه قاعة السنتر */
        .world.zoomed {
            transform: rotateX(85deg) rotateZ(0deg) translateY(150px) translateZ(80px) scale(1.2);
        }

        /* أرضية السنتر (سيراميك مودرن) */
        .floor {
            position: absolute;
            width: 100%;
            height: 100%;
            background: #e0e0e0;
            background-image: linear-gradient(#ccc 2px, transparent 2px), 
                              linear-gradient(90deg, #ccc 2px, transparent 2px);
            background-size: 80px 80px;
            box-shadow: inset 0 0 120px rgba(0,0,0,0.5);
        }

        /* حيطة السنتر */
        .wall-back {
            position: absolute;
            top: 0;
            left: 0;
            width: 600px;
            height: 350px;
            background: #2c3e50;
            transform-origin: top;
            transform: rotateX(-90deg); 
            border-bottom: 5px solid #1a252f;
        }

        /* الوايت بورد بتاعة السنتر */
        .whiteboard {
            position: absolute;
            top: 40px;
            left: 80px;
            width: 440px;
            height: 220px;
            background: #ffffff;
            border: 8px solid #bdc3c7; /* فريم ألومنيوم */
            border-radius: 5px;
            color: #2980b9; /* لون الماركر الأزرق */
            text-align: center;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4), inset 0 0 10px rgba(0,0,0,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            line-height: 1.6;
            transition: all 1s;
        }

        /* العناصر اللي واقفة */
        .standing-obj {
            position: absolute;
            transform-origin: bottom;
            transform: rotateX(-90deg); 
            display: flex;
            flex-direction: column;
            align-items: center;
            text-shadow: 0 10px 10px rgba(0,0,0,0.3);
            transition: all 1s;
        }

        /* ميس رحمة */
        .teacher {
            top: 150px; 
            left: 250px;
            font-size: 90px;
        }

        .name-tag {
            background: #e74c3c;
            color: white;
            font-size: 1.1rem;
            padding: 4px 15px;
            border-radius: 5px;
            margin-top: -15px;
            font-weight: 800;
            box-shadow: 0 5px 10px rgba(0,0,0,0.3);
        }

        /* طلبة السنتر */
        .student { font-size: 70px; }
        .s1 { top: 380px; left: 100px; }
        .s2 { top: 400px; left: 260px; }
        .s3 { top: 380px; left: 420px; }

        /* كلام الطلبة بعد الإلغاء */
        .bubble {
            position: absolute;
            top: -60px;
            background: white;
            color: #2c3e50;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 8px 15px;
            border-radius: 15px;
            opacity: 0;
            transform: scale(0.5) translateY(20px);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: max-content;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            border: 2px solid #3498db;
        }
        
        .bubble::after {
            content: '';
            position: absolute;
            bottom: -10px;
            left: 50%;
            margin-left: -8px;
            border-width: 8px 8px 0;
            border-style: solid;
            border-color: #3498db transparent transparent transparent;
        }

        .zoomed .bubble {
            opacity: 1;
            transform: scale(1) translateY(0);
            transition-delay: 2.2s; 
        }

        /* مايك الإدارة (الزرار) */
        .action-btn {
            position: absolute;
            bottom: 40px;
            z-index: 100;
            background: #f39c12;
            color: #fff;
            border: none;
            padding: 15px 35px;
            font-size: 1.5rem;
            font-family: 'Cairo', sans-serif;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            transition: 0.3s;
            font-weight: 800;
            border-bottom: 5px solid #d68910;
        }

        .action-btn:hover {
            transform: translateY(2px);
            border-bottom-width: 3px;
        }
    </style>
</head>
<body>

    <div class="camera">
        <!-- قاعة السنتر 3D -->
        <div class="world" id="world">
            <!-- الأرضية -->
            <div class="floor"></div>
            
            <!-- الحيطة والوايت بورد -->
            <div class="wall-back">
                <div class="whiteboard" id="boardContent">
                    شرح المنهج المكثف مع ميس رحمة 📝✨
                </div>
            </div>

            <!-- ميس رحمة -->
            <div class="standing-obj teacher">
                <span id="t-emoji">👩‍🏫</span>
                <div class="name-tag">ميس رحمة</div>
            </div>

            <!-- طلبة السنتر -->
            <div class="standing-obj student s1">
                <div class="bubble">هيييه هنروح ننام! 🏃‍♂️</div>
                👦
            </div>
            <div class="standing-obj student s2">
                <div class="bubble">ألف سلامة يا ميس ❤️</div>
                👧
            </div>
            <div class="standing-obj student s3">
                <div class="bubble">يلا بينا على القهوة ☕</div>
                👦
            </div>
        </div>
    </div>

    <!-- زرار مايك السنتر -->
    <button class="action-btn" id="actionBtn" onclick="triggerSurprise()">🎙️ إعلان عاجل من إدارة السنتر</button>

    <script>
        function triggerSurprise() {
            // 1. تحريك الكاميرا بـ 3D Zoom جوه السنتر
            document.getElementById('world').classList.add('zoomed');
            
            // 2. إخفاء الزرار
            document.getElementById('actionBtn').style.display = 'none';

            // 3. تغيير محتوى الوايت بورد 
            setTimeout(() => {
                const board = document.getElementById('boardContent');
                board.style.color = '#c0392b'; // القلم يتغير لأحمر
                board.innerHTML = `
                    <div style="font-size: 1.4rem; line-height: 1.6; font-weight: bold;">
                        🚨 تنبيه لجميع الطلبة 🚨<br>
                        الحصة ملغية والكل يروح!<br>
                        ميس رحمة راجعة من عند الدكتور ومحتاجة ترتاح.. وصحتها عندنا بالدنيا وما فيها ❤️<br>
                        <span style="color: #2980b9; font-size: 1.1rem; display: block; margin-top: 15px;">إمضاء: الإدارة (هوبا)</span>
                    </div>
                `;
                
                // الميس تتكسف وتضحك
                document.getElementById('t-emoji').innerText = "🙈";

                // قلوب
                createHearts();
            }, 1800);
        }

        function createHearts() {
            for(let i = 0; i < 25; i++) {
                setTimeout(() => {
                    let heart = document.createElement('div');
                    heart.innerHTML = '❤️';
                    heart.style.position = 'absolute';
                    heart.style.left = Math.random() * 100 + 'vw';
                    heart.style.bottom = '-20px';
                    heart.style.fontSize = (Math.random() * 20 + 20) + 'px';
                    heart.style.zIndex = 1000;
                    heart.style.transition = 'all 4s linear';
                    document.body.appendChild(heart);
                    
                    setTimeout(() => {
                        heart.style.bottom = '120vh';
                        heart.style.transform = 'rotate(' + (Math.random() * 360) + 'deg)';
                        heart.style.opacity = '0';
                    }, 50);
                    
                    setTimeout(() => heart.remove(), 4000);
                }, i * 150);
            }
        }
    </script>
</body>
</html>
